<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="title desc">
  <title id="title">How yokla works</title>
  <desc id="desc">yokla run reads the cases and the profile and asks your assistant the customer's questions. Your assistant's model calls go through yokla proxy to your model provider. The checks judge each answer against your data, with the model calls the proxy saw, and write results.json, which the reports and yokla gate read.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; fill: #57606a; }
      .label { font-size: 12px; fill: #57606a; }
      .file { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
      .yokla { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
      .yours { fill: #ffffff; stroke: #57606a; stroke-width: 1.5; }
      .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .seen { stroke: #0969da; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="420" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Your machine -->
  <rect x="210" y="24" width="540" height="372" rx="12" fill="none" stroke="#8c959f" stroke-dasharray="5 5"/>
  <text x="228" y="48" class="label">Your machine · nothing leaves it but your app's own model calls</text>

  <!-- Inputs -->
  <rect x="24" y="110" width="160" height="50" rx="8" class="file"/>
  <text x="104" y="141" text-anchor="middle" class="title">cases/*.yaml</text>
  <rect x="24" y="190" width="160" height="50" rx="8" class="file"/>
  <text x="104" y="221" text-anchor="middle" class="title">yokla.profile.yaml</text>

  <!-- yokla run -->
  <rect x="240" y="140" width="170" height="64" rx="8" class="yokla"/>
  <text x="325" y="168" text-anchor="middle" class="title">yokla run</text>
  <text x="325" y="188" text-anchor="middle" class="sub">asks as your customers do</text>

  <!-- Your assistant -->
  <rect x="520" y="70" width="190" height="64" rx="8" class="yours"/>
  <text x="615" y="98" text-anchor="middle" class="title">Your assistant</text>
  <text x="615" y="118" text-anchor="middle" class="sub">HTTP or WebSocket</text>

  <!-- yokla proxy -->
  <rect x="520" y="200" width="190" height="64" rx="8" class="yokla"/>
  <text x="615" y="228" text-anchor="middle" class="title">yokla proxy</text>
  <text x="615" y="248" text-anchor="middle" class="sub">127.0.0.1 only</text>

  <!-- Checks -->
  <rect x="240" y="300" width="170" height="64" rx="8" class="yokla"/>
  <text x="325" y="328" text-anchor="middle" class="title">Checks</text>
  <text x="325" y="348" text-anchor="middle" class="sub">against your data</text>

  <!-- results.json -->
  <rect x="520" y="310" width="190" height="50" rx="8" class="file"/>
  <text x="615" y="341" text-anchor="middle" class="title">results.json</text>

  <!-- Outside -->
  <rect x="790" y="200" width="170" height="64" rx="8" class="yours"/>
  <text x="875" y="228" text-anchor="middle" class="title">Model provider</text>
  <text x="875" y="248" text-anchor="middle" class="sub">with your app's key</text>
  <rect x="790" y="296" width="170" height="44" rx="8" class="file"/>
  <text x="875" y="323" text-anchor="middle" class="title">Terminal · JUnit · HTML</text>
  <rect x="790" y="352" width="170" height="44" rx="8" class="yokla"/>
  <text x="875" y="379" text-anchor="middle" class="title">yokla gate · 0 1 2</text>

  <!-- Edges -->
  <path d="M184,135 L240,160" class="edge" marker-end="url(#arrow)"/>
  <path d="M184,215 L240,188" class="edge" marker-end="url(#arrow)"/>
  <path d="M410,160 C460,150 470,110 520,104" class="edge" marker-end="url(#arrow)"/>
  <text x="424" y="100" class="label">the question</text>
  <path d="M520,118 C470,128 450,170 410,180" class="edge" marker-end="url(#arrow)"/>
  <text x="440" y="200" class="label">its answer</text>
  <path d="M615,134 L615,200" class="edge" marker-end="url(#arrow)"/>
  <text x="623" y="172" class="label">its model calls</text>
  <path d="M710,232 L790,232" class="edge" marker-end="url(#arrow)"/>
    <path d="M325,204 L325,300" class="edge" marker-end="url(#arrow)"/>
  <path d="M520,250 C470,265 450,300 410,318" class="seen" marker-end="url(#arrow-blue)"/>
  <text x="528" y="292" class="label" style="fill:#0969da">calls, cost, prompts, tools</text>
  <path d="M410,334 L520,334" class="edge" marker-end="url(#arrow)"/>
  <path d="M710,330 L790,318" class="edge" marker-end="url(#arrow)"/>
  <path d="M710,342 L790,370" class="edge" marker-end="url(#arrow)"/>
</svg>
